<!doctype html>
<html>
  <head>
    <title>WhatsForDinnerC+E</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ '/styles.css' | url }}" />
  </head>

  <body>
    <img
      class="corner corner_left"
      src="{{ '/images/heart-c-plus-e.png' | url }}"
      alt="C plus E inside a heart"
    />
    <img
      class="corner corner_right"
      src="{{ '/images/no-decisions-required.png' | url }}"
      alt="no decisions required!"
    />
    <div class="center">
      <div id="spinner_wheel">
        <canvas id="wheel"></canvas>
        <div class="spin_button_wrapper">
          <div class="spin_arrow"></div>
          <button id="spin_button" class="button spin_button">SPIN</button>
        </div>
      </div>
    </div>
    <script defer src="{{ '/wheel.js' | url }}"></script>
  </body>
</html>
