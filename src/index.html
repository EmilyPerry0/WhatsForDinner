<!doctype html>
<html>
  <head>
    <title>WhatsForDinnerC+E</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ '/assets/css/base.css' | url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/wheel.css' | url }}" />
  </head>

  <body>
    <!-- The heart is the way into the easter egg. Nothing else links there. -->
    <a
      class="corner corner_left corner_link"
      href="{{ '/easter-egg/' | url }}"
      aria-label="C plus E inside a heart"
    >
      <img src="{{ '/assets/images/ui/heart-c-plus-e.png' | url }}" alt="" />
    </a>
    <!-- Same trick as the heart: the banner is a link too. Where it goes is left
         unsaid on purpose, and the label still just describes the picture. -->
    <a
      class="corner corner_right corner_link"
      href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      target="_blank"
      rel="noopener"
      aria-label="no decisions required!"
    >
      <img
        src="{{ '/assets/images/ui/no-decisions-required.png' | url }}"
        alt=""
      />
    </a>
    <div class="center">
      <!-- The two search PNGs are the box itself, so the input draws no border
           of its own and sits on top of them. Which image shows is decided in
           CSS from :focus and :placeholder-shown; the placeholder is a single
           space purely so that second selector has something to test. -->
      <div class="search" id="recipe_search_box">
        <input
          type="text"
          id="recipe_search"
          class="search_input"
          placeholder=" "
          autocomplete="off"
          spellcheck="false"
          aria-label="Search recipes"
        />
        <ul class="search_results" id="search_results" hidden></ul>
      </div>
      <div id="spinner_wheel">
        <canvas id="wheel"></canvas>
        <div class="spin_button_wrapper">
          <div class="spin_arrow"></div>
          <button id="spin_button" class="button spin_button">SPIN</button>
        </div>
      </div>
      <img
        class="personal_site"
        src="{{ '/assets/images/ui/personal_website.png' | url }}"
        alt="Personal Website"
      />
    </div>
    <script type="module" src="{{ '/assets/js/wheel.mjs' | url }}"></script>
    <script type="module" src="{{ '/assets/js/search.mjs' | url }}"></script>
  </body>
</html>
