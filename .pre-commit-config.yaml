repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      # The bundled font licence is a verbatim third-party document and should
      # stay byte for byte as published -- tidying its whitespace would be
      # editing someone else's licence text.
      - id: trailing-whitespace
        exclude: ^src/assets/fonts/
      - id: end-of-file-fixer
        exclude: ^src/assets/fonts/
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-yaml

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: "v9.39.1"
    hooks:
      - id: eslint
        name: eslint (frontend)
        files: ^(src/.*|test/.*|config/.*|\.eleventy)\.(js|mjs|cjs)$
        types: [file]
        args: [--fix, --config, eslint.config.mjs]
        additional_dependencies:
          - eslint@9.39.1
          - eslint-config-prettier@10.1.8
          - globals@16.5.0

  - repo: local
    hooks:
      - id: prettier-frontend
        name: prettier (frontend)
        entry: npx prettier --write
        language: unsupported
        files: ^(src/.*|test/.*|config/.*|\.eleventy\.js)$
        types_or: [javascript, css, scss, html, json]

      - id: unit-tests
        name: unit tests
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
